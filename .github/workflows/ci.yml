name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        include:
          - os: macos-latest
            link-flags: "-framework Accelerate"
          - os: ubuntu-latest
            link-flags: "-lopenblas -llapack -lm"
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install OpenBLAS and LAPACK (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev liblapack-dev
      - name: Configure link flags
        run: |
          cat > src/moon.pkg << EOF
          supported_targets = "native"

          options(
            link: { "native": { "cc-link-flags": "${{ matrix.link-flags }}" } },
            "native-stub": [ "blas_stub.c" ],
          )
          EOF
          cat src/moon.pkg
          cat > src/bench/moon.pkg << EOF
          import {
            "mizchi/blas" @blas,
            "moonbitlang/core/env" @env,
            "moonbitlang/core/string" @string,
          }

          supported_targets = "native"

          pkgtype(kind: "executable")

          options(
            link: { "native": { "cc-link-flags": "${{ matrix.link-flags }}" } },
            targets: { "main.mbt": [ "native" ] },
          )
          EOF
          cat src/bench/moon.pkg
      - name: Install MoonBit CLI
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Moon update
        run: moon update
      - name: Moon check
        run: moon check --target native
      - name: Moon test
        run: moon test --target native
